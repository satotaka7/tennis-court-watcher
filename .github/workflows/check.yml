name: テニスコート空き確認

on:
  schedule:
    - cron: '0 0-12/2 * * *'  # 毎日 9:00〜21:00 JST に2時間ごと (= 0:00〜12:00 UTC)
  workflow_dispatch:          # GitHub画面から手動実行も可能

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: Playwright ブラウザのキャッシュを復元
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Playwright ブラウザをインストール（キャッシュミス時のみ）
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Playwright システム依存をインストール（キャッシュヒット時）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: 空き確認・LINE通知
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          TARGETS_SHEET_ID: ${{ secrets.TARGETS_SHEET_ID }}
        run: python main.py
